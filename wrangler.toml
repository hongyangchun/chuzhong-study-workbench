# Cloudflare Pages 配置（用于本地预览与 `wrangler pages deploy`）
# 站点为纯静态单文件 + Pages Functions（functions/api/sync.js）
name = "chuzhong-study-workbench"
pages_build_output_dir = "."
compatibility_date = "2024-09-23"

# 跨设备同步用的 KV 绑定【不写在这里】，而是在 Cloudflare 后台配置：
#   Workers & Pages → 你的项目 → Settings → Functions → KV namespace bindings
#   新增绑定，Variable name 填 `studybench_sync`，选你创建的 namespace
# 代码通过 env.studybench_sync 读取，与 wrangler.toml 无关。
# （若在此处写 id，必须是真实十六进制 namespace ID，否则 Pages 构建会报
#  Error 8000022: Invalid KV namespace ID。后台已绑定则无需此段。）
