# Cloudflare Pages 配置（用于本地预览与 `wrangler pages deploy`）
# 站点为纯静态单文件 + Pages Functions（functions/api/sync.js）
name = "chuzhong-study-workbench"
pages_build_output_dir = "."
compatibility_date = "2024-09-23"

# 跨设备同步用的 KV 绑定
# ⚠️ 本项目被 Cloudflare 识别为「wrangler 管理模式」，绑定必须在此声明，
#    后台 UI 手动添加的 KV 绑定不生效。Git 部署时会读取本文件应用绑定。
# 代码通过 env.studybench_sync 读取此 KV。
# id 为 Cloudflare 后台 Workers & Pages → KV 中该 namespace 的真实 ID。
[[kv_namespaces]]
binding = "studybench_sync"
id = "0a2fc1e33ac242baab69bc569d547e90"
